# docker compose up -d --build   ->  http://127.0.0.1:8765
# The journal folder defaults to the standard Windows location; set ED_JOURNAL_DIR if yours
# is elsewhere (e.g. Saved Games moved to OneDrive).
services:
  ed-explorer-kit:
    build: .
    image: ed-explorer-kit
    ports:
      - "127.0.0.1:8765:8765"  # "8765:8765" to open it from other devices on your network
    volumes:
      - "${ED_JOURNAL_DIR:-${USERPROFILE}/Saved Games/Frontier Developments/Elite Dangerous}:/journals:ro"
      - data:/data
    restart: unless-stopped

volumes:
  data:
