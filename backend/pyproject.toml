[project]
name = "ed-explorer-kit"
version = "0.1.0"
description = "Local backend for ED Explorer Kit: journal reader, SQLite store, live API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
