[project]
name = "ed-explorer-kit"
version = "0.2.1"
description = "Local backend for ED Explorer Kit: journal reader, SQLite store, live API"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "pyzmq>=27.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
tools = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
